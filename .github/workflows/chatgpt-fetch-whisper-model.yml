name: ChatGPT Fetch Whisper Model

on:
  push:
    branches:
      - chatgpt-whisper-model-20260913

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual Whisper base q5_1 model
        run: |
          curl -L --fail --retry 3 -o ggml-base-q5_1.bin https://github.com/w3xgroup/taskurio-models/releases/download/whisper-models-v1/ggml-base-q5_1.bin
          echo "422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898  ggml-base-q5_1.bin" | sha256sum -c -
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-base-q5_1-model
          path: ggml-base-q5_1.bin
          compression-level: 0
          retention-days: 1
