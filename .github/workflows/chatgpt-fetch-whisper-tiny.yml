name: ChatGPT Fetch Whisper Tiny

on:
  push:
    branches:
      - chatgpt-whisper-model-20260913

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual Whisper tiny q5_1 model
        run: |
          curl -L --fail --retry 3 -o ggml-tiny-q5_1.bin https://github.com/w3xgroup/taskurio-models/releases/download/whisper-models-v1/ggml-tiny-q5_1.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-tiny-q5_1-model
          path: ggml-tiny-q5_1.bin
          compression-level: 0
          retention-days: 1
